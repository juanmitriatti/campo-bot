name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # DB real para la suite: los tests de integración del pipeline
    # (src/testing/integration/, FakeAgent sin API) requieren Postgres y son
    # el gate contra bugs de interacción entre capas. Sin DB se saltean y el
    # deploy queda sin esa red.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campo
          POSTGRES_PASSWORD: campo123
          POSTGRES_DB: campo_bot
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://campo:campo123@localhost:5432/campo_bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend deps
        run: npm ci

      # El runtime corre con tsx, que borra los tipos sin chequearlos, así que
      # `tsc` no se ejecutaba en ningún lado. Sin este gate se habían acumulado
      # 207 errores de tipos — y entre ellos tres bugs reales que ningún test
      # cubría (un import a un módulo inexistente que rompía PATCH /api/stock/:id,
      # columnas leídas con el nombre equivocado, y un método duplicado).
      # Va ANTES de los tests: es más rápido y no necesita DB.
      - name: Typecheck
        run: npm run typecheck

      - name: Init DB (base schema + migrations)
        run: |
          psql "$DATABASE_URL" -f init.sql
          npx tsx src/scripts/run-migrations.ts

      - name: Run tests
        run: npm test

  deploy:
    name: Railway deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # The `landing` submodule is a SEPARATE PRIVATE repo (campo-chat-bot).
      # GITHUB_TOKEN is scoped to THIS repo only and cannot read it, so a PAT
      # with read access to campo-chat-bot must be stored as the repo secret
      # LANDING_REPO_TOKEN. Fail fast with a clear message if it's missing or
      # expired (otherwise checkout dies with a cryptic "Authentication failed").
      - name: Require submodule token
        env:
          LANDING_REPO_TOKEN: ${{ secrets.LANDING_REPO_TOKEN }}
        run: |
          if [ -z "$LANDING_REPO_TOKEN" ]; then
            echo "::error title=Missing LANDING_REPO_TOKEN::The private 'landing' submodule (campo-chat-bot) can't be fetched. Create a fine-grained PAT with read access to juanmitriatti/campo-chat-bot (Repository contents: Read) and add it as the repo secret LANDING_REPO_TOKEN. Until then, deploy manually with 'railway up --detach'."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          # Auth header for github.com fetches, INCLUDING the private submodule.
          # Must be a PAT that can read campo-chat-bot — github.token alone
          # cannot (it is scoped to this repo, which is why the old
          # "|| github.token" fallback produced the cryptic exit-128 failure).
          token: ${{ secrets.LANDING_REPO_TOKEN }}

      - name: Verify landing submodule is present
        run: |
          if [ ! -f landing/package.json ]; then
            echo "::error title=Landing submodule empty::actions/checkout did not populate 'landing' — LANDING_REPO_TOKEN likely lacks access to campo-chat-bot or has expired. Regenerate the PAT and update the secret."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Bundles the SHA with the uploaded code so /api/health can report it.
      # Railway only injects RAILWAY_GIT_COMMIT_SHA on its native GitHub
      # integration, not on `railway up` deploys.
      - name: Write deploy SHA
        run: echo "${{ github.sha }}" > .deploy-sha

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_SERVICE || 'campo-bot' }}" --detach

  smoke:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_URL: https://campo-bot-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Verify new sha is live
        run: |
          set -e
          expected=$(git rev-parse --short=7 HEAD)
          echo "Waiting for /api/health to report sha=$expected"
          for i in $(seq 1 60); do
            response=$(curl -sk --max-time 10 "$PROD_URL/api/health" || echo '{}')
            live=$(echo "$response" | grep -oE '"sha":"[^"]*"' | sed 's/"sha":"//;s/"//')
            echo "[${i}] live=${live:-<empty>}"
            if [ "$live" = "$expected" ]; then
              echo "OK — $expected is live"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for $expected to go live (last seen: ${live:-<none>})"
          exit 1
