name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install backend deps
        run: npm ci

      - name: Run tests
        run: npm test

  deploy:
    name: Railway deploy
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      # Submodule (landing) is private. We need an auth token with read access
      # to juanmitriatti/campo-chat-bot so railway up can upload its contents.
      # Configure secret LANDING_REPO_TOKEN (PAT or fine-grained token).
      - name: Configure submodule auth
        if: env.LANDING_REPO_TOKEN != ''
        env:
          LANDING_REPO_TOKEN: ${{ secrets.LANDING_REPO_TOKEN }}
        run: |
          git config --global url."https://x-access-token:${LANDING_REPO_TOKEN}@github.com/".insteadOf "https://github.com/"

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.LANDING_REPO_TOKEN || github.token }}

      - name: Install Railway CLI
        run: |
          curl -fsSL https://railway.com/install.sh | bash
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      # Bundles the SHA with the uploaded code so /api/health can report it.
      # Railway only injects RAILWAY_GIT_COMMIT_SHA on its native GitHub
      # integration, not on `railway up` deploys.
      - name: Write deploy SHA
        run: echo "${{ github.sha }}" > .deploy-sha

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service "${{ vars.RAILWAY_SERVICE || 'campo-bot' }}" --detach

  smoke:
    name: Post-deploy smoke test
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_URL: https://campo-bot-production.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - name: Verify new sha is live
        run: |
          set -e
          expected=$(git rev-parse --short=7 HEAD)
          echo "Waiting for /api/health to report sha=$expected"
          for i in $(seq 1 60); do
            response=$(curl -sk --max-time 10 "$PROD_URL/api/health" || echo '{}')
            live=$(echo "$response" | grep -oE '"sha":"[^"]*"' | sed 's/"sha":"//;s/"//')
            echo "[${i}] live=${live:-<empty>}"
            if [ "$live" = "$expected" ]; then
              echo "OK — $expected is live"
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for $expected to go live (last seen: ${live:-<none>})"
          exit 1
